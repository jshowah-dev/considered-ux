<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Contact</title>
<style>
  body { font: 16px system-ui; margin: 2rem; max-width: 28rem; }
  label { display: block; margin-top: 1rem; }
  input, textarea { width: 100%; font: inherit; padding: .4rem; box-sizing: border-box; }
</style>
<form id="contact">
  <label>Name <input name="name" autocomplete="name"></label>
  <label>Email <input name="email" type="email" autocomplete="email"></label>
  <label>Message <textarea name="message" rows="4"></textarea></label>
</form>
</html>
